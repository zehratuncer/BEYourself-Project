<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alıntıyı Düzenle - Gentle Return</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#ffffff",
                      "on-tertiary-container": "#36393b",
                      "inverse-on-surface": "#ecf1ff",
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface": "#f9f9ff",
                      "surface-variant": "#d8e3fb",
                      "surface-container-low": "#f0f3ff",
                      "primary-container": "#60a5fa",
                      "on-background": "#111c2d",
                      "tertiary-container": "#a0a3a5",
                      "primary-fixed-dim": "#a4c9ff",
                      "on-tertiary-fixed": "#191c1e",
                      "tertiary-fixed": "#e0e3e5",
                      "outline-variant": "#c1c7d3",
                      "surface-container-highest": "#d8e3fb",
                      "surface-bright": "#f9f9ff",
                      "secondary-fixed": "#d4e4fa",
                      "on-primary-container": "#003a6b",
                      "error-container": "#ffdad6",
                      "surface-container": "#e7eeff",
                      "on-tertiary": "#ffffff",
                      "primary": "#0060ac",
                      "surface-dim": "#cfdaf2",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#414751",
                      "on-primary-fixed": "#001c39",
                      "inverse-surface": "#263143",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#39485a",
                      "secondary-fixed-dim": "#b9c8de",
                      "secondary-container": "#d2e1f7",
                      "surface-tint": "#0060ac",
                      "on-secondary-container": "#556477",
                      "on-primary-fixed-variant": "#004883",
                      "on-tertiary-fixed-variant": "#444749",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#c4c7c9",
                      "tertiary": "#5c5f61",
                      "surface-container-high": "#dee8ff",
                      "on-secondary-fixed": "#0d1c2d",
                      "background": "#f9f9ff",
                      "secondary": "#516072",
                      "inverse-primary": "#a4c9ff",
                      "primary-fixed": "#d4e3ff",
                      "outline": "#717783",
                      "on-surface": "#111c2d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "24px",
                      "stack-md": "24px",
                      "margin-mobile": "20px",
                      "margin-desktop": "40px",
                      "base": "8px",
                      "stack-sm": "12px",
                      "container-max": "1200px",
                      "stack-lg": "48px"
              },
              "fontFamily": {
                      "body-sm": ["Geist"],
                      "headline-lg": ["Geist"],
                      "body-lg": ["Geist"],
                      "headline-md": ["Geist"],
                      "label-sm": ["Geist"],
                      "headline-lg-mobile": ["Geist"],
                      "label-md": ["Geist"],
                      "headline-xl": ["Geist"],
                      "body-md": ["Geist"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        /* Hide scrollbar for a cleaner UI, typical in native-like web apps */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom input styles for the soft glow effect on focus */
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.4);
            background-color: #ffffff;
            border-color: transparent;
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
<button class="text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-on-surface-variant transition-all duration-200 ease-in-out p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Alıntıyı Düzenle</h1>
<button class="text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-on-surface-variant transition-all duration-200 ease-in-out p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile py-stack-md flex flex-col gap-stack-lg pb-32 md:pb-stack-md">
<!-- Form Section -->
<section class="flex flex-col gap-stack-md bg-surface-container-lowest rounded-xl p-6 shadow-[0_8px_30px_rgb(96,165,250,0.08)]">
<!-- Quote Textarea -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="quote-text">Alıntı</label>
<textarea class="w-full bg-surface-container-low border-none rounded-lg p-4 font-body-md text-on-surface resize-none input-glow transition-all duration-200" id="quote-text" placeholder="Alıntınızı buraya yazın..." rows="4">Kendini bulmak, kendini yaratmaktır.</textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Author Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="author-input">Yazar</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 font-body-md text-on-surface input-glow transition-all duration-200" id="author-input" placeholder="Yazar adı" type="text" value="Anonim"/>
</div>
<!-- Category Select -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="category-select">Kategori</label>
<div class="relative w-full">
<select class="w-full bg-surface-container-low border-none rounded-lg p-4 pr-10 font-body-md text-on-surface appearance-none input-glow transition-all duration-200" id="category-select">
<option>Motivasyon</option>
<option selected="">Kişisel Gelişim</option>
<option>Felsefe</option>
<option>Sanat</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Favorite Toggle -->
<div class="flex items-center justify-between py-2 border-t border-surface-container-high mt-2 pt-4">
<span class="font-body-md text-on-surface">Favorilere Ekle</span>
<button aria-checked="true" class="bg-primary relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" role="switch" type="button">
<span aria-hidden="true" class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
</section>
<!-- Media Section (Placeholders matching SCREEN_4) -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-headline-sm text-headline-sm text-on-background">Medya</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Photo Placeholder -->
<button class="aspect-square bg-surface-container-low rounded-xl flex flex-col items-center justify-center gap-2 text-primary hover:bg-surface-container transition-colors duration-200 border-2 border-dashed border-primary-fixed-dim hover:shadow-[0_4px_20px_rgb(96,165,250,0.12)]">
<span class="material-symbols-outlined text-4xl" data-icon="image">image</span>
<span class="font-label-md text-label-md">Fotoğraf Ekle</span>
</button>
<!-- Video Placeholder -->
<button class="aspect-square bg-surface-container-low rounded-xl flex flex-col items-center justify-center gap-2 text-primary hover:bg-surface-container transition-colors duration-200 border-2 border-dashed border-primary-fixed-dim hover:shadow-[0_4px_20px_rgb(96,165,250,0.12)]">
<span class="material-symbols-outlined text-4xl" data-icon="videocam">videocam</span>
<span class="font-label-md text-label-md">Video Ekle</span>
</button>
</div>
</section>
</main>
<!-- Bottom Action Area (Sticky on mobile, fixed at bottom) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-margin-mobile flex flex-col gap-stack-sm z-40 border-t border-surface-container-high md:relative md:bg-transparent md:border-none md:p-0 md:max-w-container-max md:mx-auto md:px-margin-mobile md:pb-stack-lg shadow-[0_-8px_30px_rgb(96,165,250,0.05)] md:shadow-none">
<button class="w-full bg-error/10 text-error font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 hover:bg-error/20 transition-all duration-200">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
            Alıntıyı Sil
        </button>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 hover:bg-surface-tint shadow-[0_4px_20px_rgb(96,165,250,0.2)] hover:shadow-[0_8px_25px_rgb(96,165,250,0.3)] transition-all duration-200">
            Alıntıyı Güncelle
        </button>
</div>
<!-- Note: BottomNavBar is intentionally suppressed as this is a transactional 'Edit' screen -->
</body></html>
